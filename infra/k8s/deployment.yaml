apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-analytics-api
  namespace: financial-analytics
  labels:
    app: financial-analytics-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: financial-analytics-api
  template:
    metadata:
      labels:
        app: financial-analytics-api
    spec:
      serviceAccountName: financial-analytics-sa
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/example-org/financial-analytics-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: financial-analytics-config
            - secretRef:
                name: financial-analytics-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}
